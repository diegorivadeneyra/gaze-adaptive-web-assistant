<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comprobación de la mirada</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/temas.css" />
    <style>
        body { background: #eef1f5; margin: 0; overflow: hidden; }
        .calib-dot {
            position: fixed; width: 26px; height: 26px; margin: -13px 0 0 -13px;
            border-radius: 50%; background: #d64545; border: 4px solid #ffffff;
            box-shadow: 0 0 0 2px #d64545; display: none; z-index: 20001;
        }
        .calib-dot::after {
            content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
            margin: -2px 0 0 -2px; border-radius: 50%; background: #ffffff;
        }
        .calib-result { font-size: 0.95rem; }
        .calib-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    </style>
    <script src="js/session.js"></script>
    <script src="js/gaze_mapping.js"></script>
</head>
<body>
    <div class="calib-dot" id="calib-dot"></div>
    <div class="pause-overlay" id="calib-panel">
        <div class="pause-card">
            <p class="pause-step">Antes de leer</p>
            <h2>Comprobación de la mirada</h2>
            <p id="calib-text">Aparecerán 5 puntos, uno por uno. <strong>Mira cada punto</strong> hasta que cambie
                de lugar (unos 2 segundos). No hace falta hacer clic.</p>
            <p class="pause-note" id="calib-note"></p>
            <div class="calib-actions" id="calib-actions">
                <button type="button" class="btn-primary" id="calib-start">Empezar</button>
            </div>
        </div>
    </div>
    <script src="js/calibracion.js"></script>
</body>
</html>
